name: Keep Streamlit app awake

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours — well inside the 12-hour sleep window
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping LitFind
        run: curl -sSf "https://litfind.streamlit.app/" > /dev/null
